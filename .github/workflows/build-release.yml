name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or Version name for the release (e.g. v0.21.0-custom)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Build PhotoCraft release binary
        run: cargo build --release -p photocraft

      - name: Determine Release Tag and Package Windows
        id: release_info
        shell: pwsh
        run: |
          $TAG = "${{ inputs.tag_name }}"
          if (-not $TAG) {
            $TAG = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v0.23.1-custom" }
          }
          "tag=$TAG" >> $env:GITHUB_OUTPUT
          $ZIP_NAME = "photocraft-$TAG-windows-x64.zip"
          $EXE_NAME = "photocraft-$TAG-windows-x64.exe"
          Write-Host "Packaging $EXE_NAME and $ZIP_NAME..."
          Copy-Item target/release/photocraft.exe .\$EXE_NAME
          Compress-Archive -Path target/release/photocraft.exe -DestinationPath .\$ZIP_NAME -Force
          Get-Item .\$EXE_NAME, .\$ZIP_NAME | Select-Object Name, Length

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: PhotoCraft ${{ steps.release_info.outputs.tag }} (Custom)
          files: |
            photocraft-*-windows-x64.zip
            photocraft-*-windows-x64.exe
          fail_on_unmatched_files: false
          draft: false
          prerelease: false

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev zsync

      - name: Install nfpm packager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo goreleaser/nfpm -p "*_amd64.deb" -D /tmp
          sudo dpkg -i /tmp/nfpm_*_amd64.deb

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Build PhotoCraft release binaries
        run: |
          cargo build --release -p photocraft -p photocraft-cli
          cargo build --release -p photocraft-cli --example man-and-completions || true

      - name: Determine Release Tag and Package Linux
        id: release_info
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_type == 'tag' && github.ref_name || 'v0.23.1-custom' }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          PHOTOCRAFT_VERSION="$TAG" packaging/linux/package.sh --skip-build --formats "appimage deb tar"
          ls -lh dist/release/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: PhotoCraft ${{ steps.release_info.outputs.tag }} (Custom)
          files: |
            dist/release/photocraft-*-linux-x86_64.AppImage
            dist/release/photocraft-*-linux-x86_64.AppImage.zsync
            dist/release/photocraft-*-linux-x86_64.tar.gz
            dist/release/photocraft-*-linux-x86_64.deb
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
